name: Déploiement GitHub Pages

# Publie le logiciel HydroCalc sur GitHub Pages à chaque push sur la branche
# principale. Activez ensuite Pages dans Settings > Pages > Source : GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4
      - name: Configuration de Pages
        uses: actions/configure-pages@v5
      - name: Téléversement de l'artefact (site statique)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Déploiement
        id: deployment
        uses: actions/deploy-pages@v4
